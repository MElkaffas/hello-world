name: Build Windows installer (Kiln)

on:
  push:
    branches: [claude/pensive-babbage-5ypy6a]
    paths: ["Kiln/**", ".github/workflows/build-windows-installer.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kiln
    env:
      # Kiln/.cargo/config.toml points target-dir at D:/kiln-build (developer machine); override it.
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      # rust-toolchain.toml pins the GNU toolchain; the runner has MSVC, which is the supported Tauri path.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Kiln/package-lock.json

      - name: Install Rust (MSVC)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Kiln -> ../target

      - name: Install npm dependencies
        run: npm ci

      # Lite installer: conversion engines are NOT bundled. tauri.conf.json still lists the
      # "engines/" resource, so provide a placeholder folder. At runtime the app falls back to
      # engines installed on the PC (FFmpeg, ImageMagick, Pandoc, ...), with a winget install button.
      - name: Create placeholder engines folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/engines | Out-Null
          Set-Content src-tauri/engines/README.txt "Lite build: conversion engines are not bundled. Install them from the app (Settings > Engines) or with winget."

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Kiln-windows-setup
          path: ${{ github.workspace }}\target\release\bundle\nsis\*.exe
          if-no-files-found: error
